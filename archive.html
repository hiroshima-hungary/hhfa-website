<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活動・資料アーカイブ | HHFA</title><style>
:root{--r:#c8102e;--g:#477050;--ink:#17212b;--paper:#f7f4ee;--gold:#e1bf75}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",Arial,sans-serif;color:var(--ink);background:var(--paper);line-height:1.7}header{background:#13222c;color:#fff;padding:18px 5vw;position:sticky;top:0;z-index:5}header a{color:#fff;text-decoration:none}nav{display:flex;gap:18px;flex-wrap:wrap;align-items:center}.brand{font-weight:800;margin-right:auto}.hero{padding:64px 5vw 38px;background:linear-gradient(135deg,#fff,#f4eee3)}.hero h1{font-size:clamp(2rem,5vw,4rem);line-height:1.12;margin:.2em 0}.hero p{max-width:850px;font-size:1.1rem}.wrap{max-width:1100px;margin:auto;padding:36px 5vw}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 8px 25px #0000000d}.card h3{margin-top:0}.btn{display:inline-block;background:var(--r);color:#fff!important;text-decoration:none;padding:10px 16px;border-radius:999px;font-weight:700}.muted{color:#64717a}.flag{height:5px;background:linear-gradient(#ce2939 0 33%,#fff 33% 66%,#477050 66%)}footer{background:#13222c;color:#fff;padding:28px 5vw;margin-top:40px}a{color:#a51931}img{max-width:100%;height:auto;border-radius:12px}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:22px 0}.archive-page{background:#fff;border-radius:16px;padding:clamp(18px,4vw,38px);margin:0 0 24px;box-shadow:0 8px 25px #0000000d}.archive-page h2{line-height:1.25}.archive-page table{max-width:100%;overflow:auto}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar button{border:1px solid #ccd2d6;background:#fff;border-radius:999px;padding:8px 13px;cursor:pointer}.toolbar button.active{background:#13222c;color:#fff}.notice{border-left:5px solid var(--r)}@media(max-width:650px){header{position:static}.hero{padding-top:38px}}
</style></head><body><div class="flag"></div><header><nav><a class="brand" href="./">← HHFA ホーム</a><a href="rules.html">会則</a></nav></header><main class="wrap"><h1>活動・資料アーカイブ</h1><p>旧サイトの記録を保存したアーカイブです。各記事の写真は、旧サイトでその記事に掲載されていた写真と同じ対応関係で表示しています。</p><div class="toolbar" id="filters"><button class="active" data-kind="all">すべて</button><button data-kind="activity">活動報告</button><button data-kind="letter">ハンガリー便り</button><button data-kind="english">English</button><button data-kind="profile">プロフィール</button></div><div id="pages"><p>読み込み中…</p></div></main><footer>© ひろしま・ハンガリー友好協会</footer><script>
let all=[];
function cleanBody(html){return html.replace(/<div id="content_area"[^>]*>/,'<div>').replace(/<img /g,'<img loading="lazy" decoding="async" ')}
function render(kind='all'){const box=document.getElementById('pages');const pages=all.filter(p=>p.kind!=='rules'&&p.kind!=='home'&&(kind==='all'||p.kind===kind));box.innerHTML=pages.map(p=>'<article class="archive-page" id="'+p.id+'" data-kind="'+p.kind+'"><h2>'+p.title+'</h2>'+cleanBody(p.body)+'</article>').join('')||'<p>該当する記録はありません。</p>';if(location.hash){const el=document.querySelector(location.hash);if(el)el.scrollIntoView()}}
fetch('content.json').then(r=>r.json()).then(d=>{all=d.pages;render(location.hash==='#english'?'english':'all')}).catch(()=>document.getElementById('pages').innerHTML='<p>アーカイブを読み込めませんでした。</p>');
document.getElementById('filters').addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;document.querySelectorAll('#filters button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');render(e.target.dataset.kind)});
</script></body></html>
